apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-signed-images
  annotations:
    policies.kyverno.io/title: Require Signed Images
    policies.kyverno.io/description: >-
      Requires all images in the default namespace to be signed with Cosign
      keyless signing via the supply-chain-demo GitHub Actions workflow.
      Unsigned images are rejected at admission.
spec:
  validationFailureAction: Enforce
  background: false
  rules:
    - name: check-image-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - default
      verifyImages:
        - imageReferences:
            - "ghcr.io/prithvishenoy7/supply-chain-demo*"
          attestors:
            - count: 1
              entries:
                - keyless:
                    subject: "https://github.com/prithvishenoy7/supply-chain-demo/.github/workflows/supply-chain.yml@refs/heads/main"
                    issuer: "https://token.actions.githubusercontent.com"
